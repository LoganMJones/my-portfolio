# Optional Cloudflare Pages / Netlify-style headers.
# Pure GitHub Pages cannot set Cache-Control; put this repo behind Cloudflare
# (orange-cloud proxy) and add a Cache Rule for /assets/* and /css/* /js/*
# with Edge TTL ≥ 1 month to clear the Lighthouse "efficient cache lifetimes" audit.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
